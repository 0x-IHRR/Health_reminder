name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  macos:
    name: macOS Swift tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Swift tests
        run: swift test

  windows:
    name: Windows .NET tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Run Windows tests
        run: dotnet test Windows/HealthReminder.Windows.Tests/HealthReminder.Windows.Tests.csproj --configuration Release
