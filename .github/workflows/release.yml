name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test
        run: swift test
      - name: Package app
        run: bash Scripts/package_app.sh
      - name: Create DMG
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p release
          hdiutil create -volname HealthReminder -srcfolder build/HealthReminder.app -ov -format UDZO "release/HealthReminder-${VERSION}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: release/*.dmg
          if-no-files-found: error

  windows:
    name: Build Windows ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test Windows/HealthReminder.Windows.Tests/HealthReminder.Windows.Tests.csproj --configuration Release
      - name: Package app
        shell: pwsh
        run: ./Scripts/package_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: release/*-win-x64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - macos
      - windows
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --title "HealthReminder v${VERSION}" \
            --notes "HealthReminder v${VERSION}

          Assets:
          - macOS: HealthReminder-${VERSION}.dmg
          - Windows x64: HealthReminder-${VERSION}-win-x64.zip

          Windows is distributed as a self-contained ZIP. Unzip it and run HealthReminder.exe."
